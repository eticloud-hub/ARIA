version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: aria-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      # Exposed on 5433 for direct admin access (migrations, psql)
      # Application traffic goes through PgBouncer on 6432
      - '5433:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}' ]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: aria-pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Upstream PostgreSQL connection
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}

      # PgBouncer configuration
      LISTEN_PORT: 6432
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: 20
      MAX_CLIENT_CONN: 100
      MAX_DB_CONNECTIONS: 40
      SERVER_IDLE_TIMEOUT: 30
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    ports:
      - '6432:6432'
    healthcheck:
      test: [ 'CMD', 'pg_isready', '-h', 'localhost', '-p', '6432', '-U', '${POSTGRES_USER}' ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-queue:
    image: redis:7-alpine
    container_name: aria-redis-queue
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    ports:
      - '6379:6379'
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-cache:
    image: redis:7-alpine
    container_name: aria-redis-cache
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --port 6380
    ports:
      - '6380:6380'
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: [ 'CMD', 'redis-cli', '-p', '6380', 'ping' ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_queue_data:
  redis_cache_data:
